<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predicted Price</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .box {
            background: white;
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: bounceIn 0.8s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        h2 {
            color: #007BFF;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 40px;
            color: #222;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: #007BFF;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        a:hover {
            background: #0056b3;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="box">
    <h2>📊 Estimated Mobile Price:</h2>
    <h1>₹ {{ price }}</h1>
    <a href="/">🔁 Try Another</a>
</div>
</body>
</html>
